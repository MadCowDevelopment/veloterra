<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0d1220"/>
      <stop offset="1" stop-color="#070a11"/>
    </linearGradient>
    <linearGradient id="accent" x1="128" y1="96" x2="384" y2="416" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22e3c4"/>
      <stop offset="1" stop-color="#7cf25e"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- explored hex ring (fog cells) -->
  <g stroke="url(#accent)" stroke-width="10" opacity="0.28" fill="none">
    <path d="M256 84l70 40v81l-70 40-70-40v-81z"/>
    <path d="M256 227l70 40v81l-70 40-70-40v-81z" opacity="0.6"/>
  </g>

  <!-- central location pin -->
  <g filter="url(#glow)">
    <path d="M256 150c-52 0-94 42-94 94 0 66 94 138 94 138s94-72 94-138c0-52-42-94-94-94z" fill="url(#accent)"/>
    <circle cx="256" cy="244" r="34" fill="#070a11"/>
    <circle cx="256" cy="244" r="14" fill="url(#accent)"/>
  </g>
</svg>
